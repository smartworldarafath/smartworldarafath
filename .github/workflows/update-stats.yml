name: Update Liquid Glass Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_liquid_glass_stats.js'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate Liquid Glass Stats SVGs
        run: node scripts/generate_liquid_glass_stats.js

      - name: Commit updated stats SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/dark/stats-*.svg assets/readme/light/stats-*.svg assets/readme/dark/badge-profile-views.svg assets/readme/light/badge-profile-views.svg docs/stats-data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(stats): update liquid glass GitHub metrics SVGs"
            git push
          else
            echo "No stats changes to commit."
          fi
