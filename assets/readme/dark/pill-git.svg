<svg xmlns="http://www.w3.org/2000/svg" width="96" height="50" viewBox="0 0 96 50" role="img" aria-label="Git">
  <defs>
    <style>
      @keyframes lg-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes lg-float { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-1px) scale(1.04); } }
      .scallop-spin { animation: lg-spin 6s linear infinite; animation-delay: -6.60s; transform-origin: 0px 0px; }
      .icon-bob { animation: lg-float 3.2s ease-in-out infinite; animation-delay: -4.20s; transform-origin: 0px 0px; }
    </style>

    <clipPath id="pillClip_git">
      <rect x="2" y="2" width="92" height="46" rx="23" ry="23"/>
    </clipPath>

    <!-- Scalloped badge gradient -->
    <linearGradient id="scallopGrad_git" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Glass body base -->
    <linearGradient id="glassBg_git" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#141826" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="glassBgLight_git" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="55%" stop-color="#f1f5f9" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.62"/>
    </linearGradient>

    <!-- Chromatic glass rim -->
    <linearGradient id="glassBorder_git" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#f87171" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="glassBorderLight_git" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#f87171" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.32"/>
    </linearGradient>

    <!-- Top specular glass reflection -->
    <linearGradient id="topSpec_git" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>

    <!-- Ambient refraction orb behind badge -->
    <radialGradient id="orbGlow_git" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle shimmer highlight -->
    <linearGradient id="shimmerGrad_git" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="badgeGlow_git" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#f87171" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Clipped Liquid Glass Pill Interior -->
  <g clip-path="url(#pillClip_git)">
    <rect x="2" y="2" width="92" height="46" rx="23" fill="url(#glassBg_git)"/>
    <!-- Color-matched ambient glow refracting inside the glass -->
    <circle cx="28" cy="25" r="34" fill="url(#orbGlow_git)"/>
    <!-- Top glass reflection -->
    <rect x="2" y="2" width="92" height="46" rx="23" fill="url(#topSpec_git)"/>
    <!-- Subtle periodic specular shimmer -->
    <g opacity="0.7">
      <polygon points="-40,0 10,0 -10,50 -60,50" fill="url(#shimmerGrad_git)">
        <animateTransform attributeName="transform" type="translate" values="-40 0; 212 0; 212 0" keyTimes="0; 0.22; 1" dur="7s" begin="5.40s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- Outer Liquid Glass Border -->
  <rect x="2.6" y="2.6" width="90.8" height="44.8" rx="22.4" fill="none" stroke="url(#glassBorder_git)" stroke-width="1.2"/>

  <!-- Top Specular Rim Highlight -->
  <path d="M 25 3.5 H 71" stroke="rgba(255,255,255,0.52)" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

  <!-- Animated Scalloped Badge + Upright Floating Icon -->
  <g transform="translate(25, 25)">
    <g class="scallop-spin" filter="url(#badgeGlow_git)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
