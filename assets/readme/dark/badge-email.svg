<svg xmlns="http://www.w3.org/2000/svg" width="98" height="42" viewBox="0 0 98 42" role="img" aria-label="Email">
  <defs>
    <clipPath id="be_clip">
      <rect x="3" y="3" width="92" height="36" rx="12" ry="12"/>
    </clipPath>

    <linearGradient id="be_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
           <stop offset="48%" stop-color="#141826" stop-opacity="0.68"/>
           <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="be_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#D14836"/>
    </linearGradient>

    <linearGradient id="be_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48"/>
           <stop offset="48%" stop-color="#f87171" stop-opacity="0.34"/>
           <stop offset="100%" stop-color="#ffffff" stop-opacity="0.20"/>
    </linearGradient>

    <linearGradient id="be_bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>

    <radialGradient id="be_orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#D14836" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="be_shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="be_chipGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#f87171" flood-opacity="0.50"/>
    </filter>
  </defs>

  <g clip-path="url(#be_clip)">
    <rect x="3" y="3" width="92" height="36" rx="12" fill="url(#be_bg)"/>
    <circle cx="25" cy="21" r="32" fill="url(#be_orb)"/>
    <rect x="3" y="3" width="92" height="36" rx="12" fill="url(#be_bevel)"/>
    <polygon points="-40,0 8,0 -10,42 -58,42" fill="url(#be_shimmer)">
      <animateTransform attributeName="transform" type="translate" values="-40 0; 202 0; 202 0" keyTimes="0; 0.22; 1" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Outer Liquid Glass Border & Top Rim -->
  <rect x="3.6" y="3.6" width="90.8" height="34.8" rx="11.4" fill="none" stroke="url(#be_border)" stroke-width="1.2"/>
  <path d="M 15 4.3 H 83" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round"/>

  <!-- Left Glowing Glass Brand Chip -->
  <g transform="translate(9, 9)" filter="url(#be_chipGlow)">
    <rect x="0" y="0" width="24" height="24" rx="7" fill="url(#be_chip)"/>
    <rect x="0.4" y="0.4" width="23.2" height="23.2" rx="6.6" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8"/>
    <g transform="translate(4, 4) scale(0.6667)">
      <rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M3.5 6.5L12 13l8.5-6.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Label -->
  <text x="41" y="25.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="-0.1" fill="#f8fafc">Email</text>
</svg>