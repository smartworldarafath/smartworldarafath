<svg xmlns="http://www.w3.org/2000/svg" width="446" height="206" viewBox="0 0 446 206" role="img" aria-label="GitHub Streak Stats">
  <defs>
    
    <clipPath id="st_clip">
      <rect x="4" y="4" width="438" height="198" rx="22" ry="22"/>
    </clipPath>

    <linearGradient id="st_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.105"/>
           <stop offset="48%" stop-color="#1a1b27" stop-opacity="0.68"/>
           <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="st_spec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
           <stop offset="22%" stop-color="#ffffff" stop-opacity="0.04"/>
           <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
           <stop offset="100%" stop-color="#70a5fd" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="st_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
           <stop offset="32%" stop-color="#70a5fd" stop-opacity="0.32"/>
           <stop offset="68%" stop-color="#bf91f3" stop-opacity="0.28"/>
           <stop offset="100%" stop-color="#38bdae" stop-opacity="0.42"/>
    </linearGradient>

    <radialGradient id="st_orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#70a5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st_orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bf91f3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#bf91f3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="st_orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdae" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdae" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="st_well" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.11"/>
           <stop offset="65%" stop-color="#0b1020" stop-opacity="0.25"/>
           <stop offset="100%" stop-color="#000000" stop-opacity="0.36"/>
    </radialGradient>

    <linearGradient id="st_ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9cc2ff"/>
      <stop offset="55%" stop-color="#70a5fd"/>
      <stop offset="100%" stop-color="#5b8def"/>
    </linearGradient>

    <filter id="st_cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="st_glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#70a5fd" flood-opacity="0.45"/>
    </filter>
  
    <linearGradient id="st_divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  
    <!-- Base Drop Shadow -->
    <rect x="4" y="4" width="438" height="198" rx="22" fill="#0b0f1a" opacity="0.78" filter="url(#st_cardShadow)"/>

    <!-- Clipped Liquid Glass Interior -->
    <g clip-path="url(#st_clip)">
      <rect x="4" y="4" width="438" height="198" rx="22" fill="url(#st_bg)"/>
      <!-- Ambient Liquid Refraction Orbs -->
      <circle cx="71" cy="37" r="125" fill="url(#st_orbBlue)"/>
      <circle cx="384" cy="175" r="116" fill="url(#st_orbPurple)"/>
      <circle cx="232" cy="113" r="107" fill="url(#st_orbTeal)"/>
      <!-- Specular Curved Reflection -->
      <rect x="4" y="4" width="438" height="198" rx="22" fill="url(#st_spec)"/>
    </g>

    <!-- Chromatic Rim Border -->
    <rect x="4.6" y="4.6" width="436.8" height="196.8" rx="21.4" fill="none" stroke="url(#st_rim)" stroke-width="1.2"/>
    <!-- Top Specular Highlight Line -->
    <path d="M 34 5.4 H 412" stroke="#ffffff" stroke-opacity="0.52" stroke-width="1" stroke-linecap="round"/>
  

  <!-- Etched Vertical Glass Dividers -->
  <rect x="148" y="30" width="1" height="146" fill="url(#st_divider)"/>
  <rect x="297" y="30" width="1" height="146" fill="url(#st_divider)"/>

  <!-- Column 1: Total Contributions -->
  <g transform="translate(76, 103)" text-anchor="middle">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#70a5fd">5,077</text>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#70a5fd">Total Contributions</text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#38bdae">Jan 1, 2023 - Present</text>
  </g>

  <!-- Column 2: Current Streak -->
  <g transform="translate(223, 82)" text-anchor="middle">
    <!-- Inner Liquid Glass Well -->
    <circle cx="0" cy="0" r="38" fill="url(#st_well)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Ring with top gap for flame -->
    <circle cx="0" cy="0" r="39" fill="none" stroke="url(#st_ringGrad)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="210 36" transform="rotate(-64)" filter="url(#st_glowSoft)"/>
    <!-- Flame Icon sitting in top gap -->
    <g transform="translate(-11, -50)" filter="url(#st_glowSoft)">
      <path d="M12.9 2.3c.2 2.4-1.3 4.2-2.8 5.6-1.4 1.3-2.6 2.8-2.6 5.1 0 2.7 2.1 5 4.8 5 3.1 0 5.4-2.5 5.4-5.9 0-2.6-1.3-4.9-2.8-6.6-.2 1.2-.8 2.2-1.7 2.8.5-2.1.4-4.2-.3-6zm-.6 13.7c-1.4 0-2.5-1.1-2.5-2.5 0-1.1.6-2 1.6-2.9.8-.7 1.4-1.4 1.7-2.2.8 1.2 1.5 2.5 1.5 4.2 0 1.9-1 3.4-2.3 3.4z" fill="#70a5fd"/>
    </g>
    <text x="0" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#bf91f3">12</text>
    <text x="0" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#bf91f3">Current Streak</text>
    <text x="0" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#38bdae">Nov 17 - Nov 28</text>
  </g>

  <!-- Column 3: Longest Streak -->
  <g transform="translate(370, 103)" text-anchor="middle">
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#70a5fd">60</text>
    <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#70a5fd">Longest Streak</text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#38bdae">Sep 17 - Nov 15</text>
  </g>
</svg>