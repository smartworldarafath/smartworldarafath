<svg xmlns="http://www.w3.org/2000/svg" width="290" height="54" viewBox="0 0 290 54" role="img" aria-label="SUPPORT SUPPORTKORI">
  <defs>
    <clipPath id="bkori_clip">
      <rect x="4" y="4" width="282" height="46" rx="14" ry="14"/>
    </clipPath>

    <linearGradient id="bkori_left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="bkori_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>

    <linearGradient id="bkori_bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="bkori_shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="bkori_glow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ff5252" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="282" height="46" rx="14" fill="#000000" opacity="0.2" filter="url(#bkori_glow)"/>

  <g clip-path="url(#bkori_clip)">
    <!-- Left Smoked Glass Segment -->
    <rect x="4" y="4" width="124" height="46" fill="url(#bkori_left)"/>
    <!-- Right Colored Liquid Glass Segment -->
    <rect x="128" y="4" width="158" height="46" fill="url(#bkori_right)"/>
    <!-- Glossy Top Bevel Overlay -->
    <rect x="4" y="4" width="282" height="46" fill="url(#bkori_bevel)"/>
    <!-- Segment Glass Divider -->
    <line x1="128" y1="4" x2="128" y2="50" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
    <!-- Subtle Specular Shimmer -->
    <polygon points="-50,0 10,0 -12,54 -72,54" fill="url(#bkori_shimmer)">
      <animateTransform attributeName="transform" type="translate" values="-50 0; 412 0; 412 0" keyTimes="0; 0.22; 1" dur="6.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Outer Liquid Glass Border & Top Rim -->
  <rect x="4.6" y="4.6" width="280.8" height="44.8" rx="13.4" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.2"/>
  <path d="M 18 5.4 H 272" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1" stroke-linecap="round"/>

  <!-- Left Coffee Icon + Text -->
  <g transform="translate(20, 19) scale(0.70)">
    <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M5 8h12v9a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8z"/><line x1="6" y1="4" x2="16" y2="4"/></g>
  </g>
  <text x="45" y="31.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#f8fafc">SUPPORT</text>

  <!-- Right Segment Text -->
  <text x="207" y="31.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" letter-spacing="1.6" fill="#ffffff">SUPPORTKORI</text>
</svg>