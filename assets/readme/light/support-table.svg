<svg xmlns="http://www.w3.org/2000/svg" width="568" height="126" viewBox="0 0 568 126" role="img" aria-label="SupportKori Direct Link">
  <defs>
    <clipPath id="supTbl_clip">
      <rect x="4" y="4" width="560" height="118" rx="18" ry="18"/>
    </clipPath>

    <linearGradient id="supTbl_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90"/>
           <stop offset="55%" stop-color="#f8fafc" stop-opacity="0.78"/>
           <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.70"/>
    </linearGradient>

    <linearGradient id="supTbl_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
           <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.65"/>
           <stop offset="100%" stop-color="#fde68a" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="supTbl_smiley" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe234"/>
      <stop offset="50%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#f5a600"/>
    </linearGradient>

    <radialGradient id="supTbl_orbRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="supTbl_orbAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <filter id="supTbl_shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="supTbl_smileyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ffd000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="560" height="118" rx="18" fill="#e2e8f0" opacity="0.45" filter="url(#supTbl_shadow)"/>

  <g clip-path="url(#supTbl_clip)">
    <rect x="4" y="4" width="560" height="118" rx="18" fill="url(#supTbl_bg)"/>
    <circle cx="85" cy="24" r="110" fill="url(#supTbl_orbRose)"/>
    <circle cx="480" cy="100" r="115" fill="url(#supTbl_orbAmber)"/>

    <!-- Header Row Tint -->
    <rect x="4" y="4" width="560" height="46" fill="rgba(255,255,255,0.45)"/>

    <!-- Table Hairlines -->
    <line x1="4" y1="50" x2="564" y2="50" stroke="rgba(15,23,42,0.11)" stroke-width="1"/>
    <line x1="194" y1="4" x2="194" y2="122" stroke="rgba(15,23,42,0.11)" stroke-width="1"/>
  </g>

  <!-- Outer Glass Rim -->
  <rect x="4.6" y="4.6" width="558.8" height="116.8" rx="17.4" fill="none" stroke="url(#supTbl_border)" stroke-width="1.2"/>
  <!-- Top Specular Rim Highlight -->
  <path d="M 22 5.4 H 546" stroke="#ffffff" stroke-opacity="0.96" stroke-width="1" stroke-linecap="round"/>

  <!-- Header Titles -->
  <text x="26" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.2" fill="#0f172a">Method</text>
  <text x="216" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.2" fill="#0f172a">Details / Direct Link</text>

  <!-- Row: SupportKori Smiley Icon -->
  <g transform="translate(26, 68)" filter="url(#supTbl_smileyGlow)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="url(#supTbl_smiley)"/>
    <rect x="0.5" y="0.5" width="35" height="35" rx="9.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
    <g transform="translate(6, 6)" fill="none" stroke="#171717" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 14s1.5 2.5 4 2.5 4-2.5 4-2.5"/>
      <circle cx="9" cy="9.5" r="1" fill="#171717" stroke="none"/>
      <circle cx="15" cy="9.5" r="1" fill="#171717" stroke="none"/>
    </g>
  </g>
  <text x="74" y="91.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" letter-spacing="-0.15" fill="#0f172a">SupportKori</text>

  <!-- Row: Direct Link -->
  <text x="216" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2563eb" text-decoration="underline">https://www.supportkori.com/arafathrahman</text>
</svg>